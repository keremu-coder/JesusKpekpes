name: Probe vendor downloads
on:
  push:
    branches: [installer]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Equalizer APO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Say([string]$text) { Write-Host $text }
          $best = Invoke-RestMethod -Uri 'https://sourceforge.net/projects/equalizerapo/best_release.json' -UserAgent 'curl/8.0' -TimeoutSec 60
          $win = $best.platform_releases.windows
          if (-not $win.filename) { throw 'best_release.json has no windows file' }
          $stable = 'https://sourceforge.net/projects/equalizerapo/files' + $win.filename + '/download'
          Say "stable url: $stable"
          $dest = Join-Path $env:RUNNER_TEMP 'apo.exe'
          Invoke-WebRequest -Uri $stable -OutFile $dest -UserAgent 'curl/8.0' -MaximumRedirection 10 -TimeoutSec 180
          $sha = (Get-FileHash $dest -Algorithm SHA256).Hash
          Say "sha256: $sha"
          if ($sha -ne '7403BE7427BBE1936A40DDED082829B6E217FC4F5990FEE5CBA501F0AE055AFA') { throw 'unexpected Equalizer APO hash' }
          $proc = Start-Process -FilePath $dest -ArgumentList '/S' -PassThru
          $root = Join-Path $env:ProgramFiles 'EqualizerAPO'
          $need = @('EqualizerAPO.dll','DeviceSelector.exe','Editor.exe') | ForEach-Object { Join-Path $root $_ }
          $ready = $false
          foreach ($i in 1..90) {
            if (-not ($need | Where-Object { -not (Test-Path -LiteralPath $_) })) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          Get-Process -Name 'DeviceSelector','Configurator' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) { try { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } catch { Say 'setup already closed' } }
          Say "files ready: $ready"
          Say "configurator.exe exists: $(Test-Path (Join-Path $root 'Configurator.exe'))"
          Say "device selector exists: $(Test-Path (Join-Path $root 'DeviceSelector.exe'))"
          if (-not $ready) { throw 'Equalizer APO files were not copied' }
      - name: ReaPlugs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Say([string]$text) { Write-Host $text }
          $url = 'https://www.reaper.fm/reaplugs/reaplugs236_x64-install.exe'
          $dest = Join-Path $env:RUNNER_TEMP 'reaplugs.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest -UserAgent 'curl/8.0' -TimeoutSec 180
          $sha = (Get-FileHash $dest -Algorithm SHA256).Hash
          Say "sha256: $sha"
          if ($sha -ne '1654F1F78D746FC87A6F6D078A8F928EA61C7B49997B1F2C07DFC870F8FA6C10') { throw 'unexpected ReaPlugs hash' }
          $dir = Join-Path $env:ProgramFiles 'VSTPlugins\ReaPlugs'
          $proc = Start-Process -FilePath $dest -ArgumentList @('/S', "/D=$dir") -PassThru
          $dll = Join-Path $dir 'reacomp-standalone.dll'
          $ready = $false
          foreach ($i in 1..120) {
            if ((Test-Path -LiteralPath $dll) -and (Test-Path -LiteralPath (Join-Path $dir 'reaxcomp-standalone.dll'))) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $proc.HasExited) { try { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } catch { Say 'setup already closed' } }
          Say "exit: $(if ($proc.HasExited) { $proc.ExitCode } else { 'killed' })"
          Say "reacomp: $(Test-Path -LiteralPath $dll)"
          if ($ready) { Say "files: $((Get-ChildItem $dir -Name) -join ', ')" }
          if (-not $ready) { throw 'ReaPlugs did not write reacomp-standalone.dll' }
