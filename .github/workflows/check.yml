name: Check
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test engine/engine.test.ts
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/EngineTests.csproj
      - name: Build the plugin
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /LD /O2 /Brepro /Fe:plugin\JesusKpekpesTune.dll plugin\tune.c /link /Brepro
      - name: Run the plugin's own check
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /O2 /DTUNE_CHECK /Fe:plugin\tunecheck.exe plugin\tune.c
          plugin\tunecheck.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JesusKpekpesTune
          path: plugin/JesusKpekpesTune.dll
      - name: Keep the shipped plugin equal to the source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add plugin/JesusKpekpesTune.dll
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'plugin already matches the source'; exit 0 }
          git commit -m "Build the plugin from $env:GITHUB_SHA [skip ci]"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { Write-Host 'main moved; the next run updates the plugin'; exit 0 }
      - name: The app must ship the plugin
        shell: pwsh
        run: if (-not (Test-Path plugin/JesusKpekpesTune.dll)) { throw 'JesusKpekpesTune.dll was not built' }
      - run: dotnet build app/JesusKpekpes.App.csproj -c Release
