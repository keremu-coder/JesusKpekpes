name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the plug-in
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /LD /O2 /Brepro /Fe:plugin\JesusKpekpesTune.dll plugin\tune.c /link /Brepro
          cl /nologo /std:c11 /O2 /DTUNE_CHECK /Fe:plugin\tunecheck.exe plugin\tune.c
          plugin\tunecheck.exe
      - name: Compare the C plugin with the C# preview
        shell: pwsh
        run: |
          $env:TUNE_PIPE = (Resolve-Path plugin\tunecheck.exe).Path
          dotnet run --project tests/EngineTests.csproj -c Release
      - name: Build the controller program
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --version-file pc/controller/version_info.txt --name KpekpesPCOptimizer pc/controller/ds4_optimize_final.py
          if (-not (Test-Path dist/KpekpesPCOptimizer.exe)) { throw 'controller program was not built' }
          Copy-Item -LiteralPath dist/KpekpesPCOptimizer.exe -Destination pc/controller/KpekpesPCOptimizer.exe -Force
      - name: Publish the window
        shell: pwsh
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'a tag must look like v1.2.3' }
          }
          dotnet publish app/JesusKpekpes.App.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=$version -p:InformationalVersion=$env:GITHUB_SHA -p:DebugType=none -p:DebugSymbols=false
          if (-not (Test-Path publish/JesusKpekpes.exe)) { throw 'JesusKpekpes.exe was not published' }
          if (-not (Test-Path publish/JesusKpekpesTune.dll)) { throw 'the plug-in was not copied next to the exe' }
          if (-not (Test-Path publish/pc/Kpekpes.ps1)) { throw 'the PC script was not copied next to the exe' }
          if (-not (Test-Path publish/pc/controller/KpekpesPCOptimizer.exe)) { throw 'the controller program was not copied next to the exe' }
          Copy-Item USING.txt publish/USING.txt
          Copy-Item plugin/NOTICE.txt publish/NOTICE.txt
      - name: Sign if a certificate is stored
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PW: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host 'No certificate stored. The exe stays unsigned.'; exit 0 }
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kit) { throw 'signtool was not found' }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          & $kit.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PW /tr http://timestamp.digicert.com /td SHA256 publish/JesusKpekpes.exe publish/pc/controller/KpekpesPCOptimizer.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Remove-Item -LiteralPath $pfx -Force
      - name: Build the installer
        shell: pwsh
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'a tag must look like v1.2.3' }
          }
          $payload = Join-Path $env:GITHUB_WORKSPACE 'setup\payload.zip'
          if (Test-Path $payload) { Remove-Item $payload -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'publish\*') -DestinationPath $payload
          dotnet publish setup/JesusKpekpes.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -p:Version=$version -o setup-out
          if (-not (Test-Path setup-out/JesusKpekpes-Setup.exe)) { throw 'the installer was not built' }
      - name: Sign the installer if a certificate is stored
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PW: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host 'No certificate stored. The installer stays unsigned.'; exit 0 }
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kit) { throw 'signtool was not found' }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          & $kit.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PW /tr http://timestamp.digicert.com /td SHA256 setup-out/JesusKpekpes-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Remove-Item -LiteralPath $pfx -Force
      - name: Zip
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'JesusKpekpes-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path publish\* -DestinationPath $zip
          $setup = Join-Path $env:GITHUB_WORKSPACE 'setup-out\JesusKpekpes-Setup.exe'
          $lines = @(
            "$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash)  JesusKpekpes-win-x64.zip",
            "$((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash)  JesusKpekpes-Setup.exe"
          )
          Set-Content -LiteralPath SHA256SUMS.txt -Value $lines -Encoding ascii
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'build-' + $env:GITHUB_SHA.Substring(0, 7) }
          $title = if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag } else { "Build $tag" }
          $signed = if ($env:HAS_CERT -eq 'true') { 'This build was signed with the stored certificate.' } else { 'This build is not signed.' }
          if ($env:GITHUB_REF_TYPE -ne 'tag') { gh release delete $tag --yes --cleanup-tag 2>$null | Out-Null }
          @(
            $signed
            'Already installed? Open Jesus Kpekpes and press Update on the first window. Nothing to download. Only a copy that already has an Update button can do this; if yours has none, install this one once.'
            'Run JesusKpekpes-Setup.exe to install. Uninstall from Windows Settings puts the PC changes back and leaves audio as it is.'
            'Or extract JesusKpekpes-win-x64.zip and run JesusKpekpes.exe from inside it.'
            ''
            (Get-Content -LiteralPath USING.txt -Raw)
          ) | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          $ghArgs = @('release', 'create', $tag, 'JesusKpekpes-win-x64.zip', 'setup-out/JesusKpekpes-Setup.exe', 'SHA256SUMS.txt', '--title', $title, '--notes-file', 'release-notes.txt', '--target', $env:GITHUB_SHA)
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $ghArgs += '--prerelease' }
          gh @ghArgs
